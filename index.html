<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potluck Roulette 2.0</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #ff9a9e 0%, #ff6a00 100%); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; max-width: 450px; width: 100%; }
        h1 { color: #d35400; margin: 0 0 10px 0; font-size: 24px; }
        #canvas { border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 15px 0; transition: 1s ease-out; }
        .spinning { transform: rotate(1080deg); }
        .option-btn { display: block; width: 100%; margin: 8px 0; padding: 12px; border: 2px solid #e67e22; border-radius: 12px; background: white; cursor: pointer; font-weight: bold; color: #e67e22; }
        .option-btn.selected { background: #e67e22; color: white; }
        .confirm-btn { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-weight: bold; margin-top: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(39, 174, 96, 0); } }
        .highlight { color: #d35400; font-size: 22px; font-weight: bold; margin: 10px 0; display: block; }
    </style>
</head>
<body>

<div class="card">
    <h1 id="title">Step 1: Ingredients</h1>
    <p id="subt">Spin to get 3 ingredient options.</p>
    <canvas id="canvas" width="200" height="200"></canvas>
    <div id="uiArea"></div>
</div>

<script>
    const ingredients = ["Rice", "Potato", "Tomato", "Nuts", "Chicken", "Beef", "Onion", "Cheese", "Citrus", "Apple", "Pork", "Tofu", "Beans", "Eggplant", "Corn", "Pastry", "Egg", "Honey", "Garlic", "Peppers", "Butter", "Bread"];
    const countries = ["Italian", "Mexican", "Japanese", "Indian", "French", "Thai", "Greek", "Spanish", "Chinese", "Jamaican", "Peruvian", "Vietnamese"];

    let state = JSON.parse(localStorage.getItem('potluck_state')) || { phase: 1, ingPool: [], ctryPool: [], selIng: null, selCtry: null };
    let tempSel = null; // Track unsaved selection

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function drawWheel() {
        ctx.clearRect(0, 0, 200, 200);
        ctx.fillStyle = (state.phase === 2) ? "#2980b9" : "#e67e22";
        ctx.beginPath(); ctx.arc(100, 100, 95, 0, Math.PI * 2); ctx.fill();
    }

    function spin() {
        canvas.classList.add('spinning');
        setTimeout(() => {
            canvas.classList.remove('spinning');
            if (state.phase === 1) {
                const i = ingredients[Math.floor(Math.random() * ingredients.length)];
                if (!state.ingPool.includes(i)) state.ingPool.push(i);
            } else {
                const c = countries[Math.floor(Math.random() * countries.length)];
                if (!state.ctryPool.includes(c)) state.ctryPool.push(c);
            }
            save(); updateUI();
        }, 1000);
    }

    function save() { localStorage.setItem('potluck_state', JSON.stringify(state)); }

    function updateUI() {
        const ui = document.getElementById("uiArea");
        const title = document.getElementById("title");
        const subt = document.getElementById("subt");
        drawWheel();

        // Phase 1 & 2: Spinning
        if (state.phase < 3) {
            const list = state.phase === 1 ? state.ingPool : state.ctryPool;
            title.innerText = state.phase === 1 ? "Step 1: Ingredients" : "Step 2: Cuisines";
            subt.innerText = `Collected ${list.length}/3`;
            
            ui.innerHTML = list.map(item => `<div class="option-btn">${item}</div>`).join('');
            if (list.length < 3) ui.innerHTML += `<button class="option-btn" onclick="spin()">🎰 Spin for ${state.phase === 1 ? 'Ingredient' : 'Country'}</button>`;
            else ui.innerHTML += `<button class="confirm-btn" onclick="state.phase++; save(); updateUI();">Move to Next Step ➔</button>`;
        } 
        // Phase 3: Final Selection
        else if (!state.selIng || !state.selCtry) {
            title.innerText = "Final Selection";
            subt.innerText = !state.selIng ? "Pick your Ingredient:" : "Pick your Country:";
            const choices = !state.selIng ? state.ingPool : state.ctryPool;
            
            ui.innerHTML = choices.map(item => 
                `<button class="option-btn ${tempSel === item ? 'selected' : ''}" onclick="tempSel='${item}'; updateUI();">${item}</button>`
            ).join('');
            
            if (tempSel) ui.innerHTML += `<button class="confirm-btn" onclick="${!state.selIng ? 'state.selIng=tempSel' : 'state.selCtry=tempSel'}; tempSel=null; save(); updateUI();">Confirm Choice ✅</button>`;
        } 
        // Result
        else {
            title.innerText = "Your Potluck Dish";
            ui.innerHTML = `<span class="highlight">${state.selCtry} ${state.selIng}</span>
            <button class="confirm-btn" onclick="localStorage.clear(); location.reload();">Start Over</button>`;
        }
    }

    updateUI();
</script>
</body>
</html>
