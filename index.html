<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potluck Roulette</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #ff9a9e 0%, #ff6a00 100%); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; max-width: 450px; width: 100%; box-sizing: border-box; }
        h1 { color: #d35400; margin-top: 0; font-size: 26px; }
        
        #canvas { border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 10px 0; transition: transform 1s ease-out; }
        .spinning { transform: rotate(1080deg); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .option-btn { padding: 12px; border: 2px solid #e67e22; border-radius: 12px; background: white; cursor: pointer; font-weight: bold; color: #e67e22; transition: 0.2s; }
        .option-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .option-btn.selected { background: #e67e22; color: white; }
        .confirm-btn { background-color: #27ae60; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-weight: bold; margin-top: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); } }
        .highlight { color: #d35400; font-weight: bold; font-size: 24px; display: block; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="title">Step 1: Ingredients</h1>
        <p id="subt">Spin 3 times to build your pool.</p>
        <canvas id="canvas" width="200" height="200"></canvas>
        <div id="uiArea"></div>
        <button onclick="localStorage.clear(); location.reload();" style="background:none; border:none; color:#95a5a6; font-size: 10px; cursor:pointer; margin-top:20px; text-decoration:underline;">Reset Application</button>
    </div>

<script>
    const ingredientsList = ["Rice", "Potato", "Tomato", "Nuts", "Chicken", "Beef", "Onion", "Cheese", "Citrus", "Apple", "Pork", "Tofu", "Beans", "Eggplant", "Corn", "Pastry", "Egg", "Honey", "Garlic", "Peppers", "Butter", "Bread"];
    const countriesList = ["Italian", "Mexican", "Japanese", "Indian", "French", "Thai", "Greek", "Spanish", "Chinese", "Jamaican", "Peruvian", "Vietnamese"];

    let state = JSON.parse(localStorage.getItem('potluck_v2')) || { phase: 1, ings: [], ctries: [], final: null, tempIng: null, tempCtry: null };

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function drawWheel() {
        ctx.clearRect(0, 0, 200, 200);
        ctx.fillStyle = state.phase === 1 ? "#e67e22" : "#2980b9";
        ctx.beginPath(); ctx.arc(100, 100, 90, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "white"; ctx.font = "bold 20px Arial"; ctx.fillText("SPIN", 75, 105);
    }

    function spin() {
        const btn = document.getElementById("spinBtn");
        canvas.classList.add("spinning");
        if (btn) btn.disabled = true;

        setTimeout(() => {
            canvas.classList.remove("spinning");
            if (state.phase === 1 && state.ings.length < 3) {
                let i = ingredientsList[Math.floor(Math.random() * ingredientsList.length)];
                if (!state.ings.includes(i)) state.ings.push(i);
            } else if (state.phase === 2 && state.ctries.length < 3) {
                let c = countriesList[Math.floor(Math.random() * countriesList.length)];
                if (!state.ctries.includes(c)) state.ctries.push(c);
            }
            save(); updateUI();
        }, 1000);
    }

    function save() { localStorage.setItem('potluck_v2', JSON.stringify(state)); }

    function updateUI() {
        drawWheel();
        const ui = document.getElementById("uiArea");
        const title = document.getElementById("title");
        const subt = document.getElementById("subt");

        if (state.phase < 3) {
            const list = state.phase === 1 ? state.ings : state.ctries;
            title.innerText = state.phase === 1 ? "Step 1: Ingredients" : "Step 2: Cuisines";
            subt.innerText = `Collected ${list.length}/3`;
            ui.innerHTML = `<div class="grid">` + list.map(item => `<div class="option-btn">${item}</div>`).join('') + `</div>`;
            
            if (list.length < 3) ui.innerHTML += `<button id="spinBtn" class="option-btn" style="width:100%" onclick="spin()">🎰 Spin for ${state.phase === 1 ? 'Ingredient' : 'Country'}</button>`;
            else ui.innerHTML += `<button class="confirm-btn" onclick="state.phase++; save(); updateUI();">Next Step ➔</button>`;
        } 
        else if (!state.final) {
            title.innerText = "Final Choice";
            subt.innerText = !state.tempIng ? "Select one Ingredient:" : "Select one Cuisine:";
            const choices = !state.tempIng ? state.ings : state.ctries;
            
            ui.innerHTML = `<div class="grid">` + choices.map(item => 
                `<button class="option-btn ${ (state.tempIng === item || state.tempCtry === item) ? 'selected' : ''}" 
                onclick="${!state.tempIng ? 'state.tempIng' : 'state.tempCtry'}='${item}'; updateUI();">${item}</button>`
            ).join('') + `</div>`;
            
            if (state.tempIng && state.tempCtry) ui.innerHTML += `<button class="confirm-btn" onclick="state.final = state.tempCtry + ' ' + state.tempIng; save(); updateUI();">Lock Selection ✅</button>`;
        } 
        else {
            title.innerText = "Your Potluck Dish";
            ui.innerHTML = `<span class="highlight">${state.final}</span>
            <button class="confirm-btn" style="background:#3498db" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(state.final + ' recipe')}', '_blank')">Find Recipes ↗</button>`;
        }
    }
    updateUI();
</script>
</body>
</html>
