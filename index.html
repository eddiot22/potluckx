<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentridge Potluck Roulette</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #ff9a9e 0%, #ff6a00 100%); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; max-width: 450px; width: 100%; box-sizing: border-box; }
        h1 { color: #d35400; margin-top: 0; font-size: 26px; }
        p { color: #555; line-height: 1.6; }
        
        #canvas { border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 10px 0; transition: transform 1s ease-out; }
        .spinning { transform: rotate(1080deg); }
        
        .list-container { display: flex; flex-direction: column; gap: 8px; margin: 15px auto; width: 200px; }
        .option-item { padding: 10px; border: 2px solid #e67e22; border-radius: 10px; font-weight: bold; color: #e67e22; background: #fffaf0; }
        
        .matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .col { display: flex; flex-direction: column; gap: 8px; }
        .select-btn { padding: 10px; border: 2px solid #e67e22; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; color: #e67e22; }
        .select-btn.active { background: #e67e22; color: white; }
        
        .confirm-btn { background-color: #27ae60; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-weight: bold; margin-top: 10px; animation: pulse 1.5s infinite; cursor: pointer; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); } }
        .highlight { color: #d35400; font-weight: bold; font-size: 24px; display: block; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <div id="uiArea"></div>
    </div>

<script>
    const ingredientsList = ["Rice", "Potato", "Tomato", "Nuts", "Chicken", "Beef", "Onion", "Cheese", "Citrus", "Apple", "Pork", "Tofu"];
    const countriesList = ["Italian", "Mexican", "Japanese", "Indian", "French", "Thai", "Greek", "Spanish", "Chinese", "Jamaican", "Peruvian", "Vietnamese"];

    let state = JSON.parse(localStorage.getItem('potluck_v3')) || { phase: 0, ings: [], ctries: [], final: null, tempIng: null, tempCtry: null };

    const ctx = document.createElement('canvas').getContext('2d'); // Dummy context for drawing logic

    document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r') {
            if (confirm("Reset Potluck Roulette?")) { localStorage.clear(); location.reload(); }
        }
    });

    function drawWheel(canvas) {
        const ctx = canvas.getContext("2d");
        const arc = Math.PI * 2 / 12;
        ctx.clearRect(0, 0, 280, 280);
        for (let i = 0; i < 12; i++) {
            ctx.fillStyle = (state.phase === 1) 
                ? ["#e67e22", "#d35400", "#f39c12", "#e74c3c"][i % 4] 
                : ["#3498db", "#2980b9", "#1abc9c", "#16a085"][i % 4];
            ctx.beginPath(); ctx.moveTo(140, 140);
            ctx.arc(140, 140, 135, i * arc, (i + 1) * arc); ctx.fill();
        }
    }

    function spin() {
        const canvas = document.getElementById("canvas");
        const btn = document.getElementById("spinBtn");
        canvas.classList.add("spinning");
        btn.disabled = true;

        setTimeout(() => {
            canvas.classList.remove("spinning");
            if (state.phase === 1 && state.ings.length < 3) {
                let i = ingredientsList[Math.floor(Math.random() * ingredientsList.length)];
                if (!state.ings.includes(i)) state.ings.push(i);
            } else if (state.phase === 2 && state.ctries.length < 3) {
                let c = countriesList[Math.floor(Math.random() * countriesList.length)];
                if (!state.ctries.includes(c)) state.ctries.push(c);
            }
            save(); updateUI();
        }, 1000);
    }

    function save() { localStorage.setItem('potluck_v3', JSON.stringify(state)); }

    function updateUI() {
        const ui = document.getElementById("uiArea");
        
        // PHASE 0: TITLE PAGE
        if (state.phase === 0) {
            ui.innerHTML = `<h1>Pentridge Potluck Party Roulette</h1>
            <p>Welcome! Let's decide your contribution. We will spin to collect 3 ingredients and 3 cuisines, then you will choose your final dish combination.</p>
            <button class="confirm-btn" onclick="state.phase++; updateUI();">Start Roulette ➔</button>`;
        } 
        // PHASE 1 & 2: WHEELS
        else if (state.phase < 3) {
            const list = state.phase === 1 ? state.ings : state.ctries;
            ui.innerHTML = `<h1>${state.phase === 1 ? "Step 1: Ingredients" : "Step 2: Cuisines"}</h1>
            <p>Collected ${list.length}/3</p>
            <canvas id="canvas" width="280" height="280"></canvas>
            <div class="list-container">` + list.map(item => `<div class="option-item">${item}</div>`).join('') + `</div>`;
            
            drawWheel(document.getElementById("canvas"));

            if (list.length < 3) ui.innerHTML += `<button id="spinBtn" class="confirm-btn" style="animation:none; background:#e67e22" onclick="spin()">🎰 Spin Wheel</button>`;
            else ui.innerHTML += `<button class="confirm-btn" onclick="state.phase++; save(); updateUI();">Move to Next Step ➔</button>`;
        } 
        // PHASE 3: FINAL SELECTION
        else if (!state.final) {
            ui.innerHTML = `<h1>Final Decision</h1>
            <p>Select one from each column to lock in your dish:</p>
            <div class="matrix">
                <div class="col"><strong>Ingredients</strong>${state.ings.map(i => `<button class="select-btn ${state.tempIng===i?'active':''}" onclick="state.tempIng='${i}'; updateUI();">${i}</button>`).join('')}</div>
                <div class="col"><strong>Cuisines</strong>${state.ctries.map(c => `<button class="select-btn ${state.tempCtry===c?'active':''}" onclick="state.tempCtry='${c}'; updateUI();">${c}</button>`).join('')}</div>
            </div>`;
            
            if (state.tempIng && state.tempCtry) ui.innerHTML += `<button class="confirm-btn" onclick="state.final = state.tempCtry + ' ' + state.tempIng; save(); updateUI();">Lock Selection ✅</button>`;
        } 
        // RESULT
        else {
            ui.innerHTML = `<h1>Your Potluck Dish</h1>
            <span class="highlight">${state.final}</span>
            <p>Enjoy your cooking!</p>
            <button class="confirm-btn" style="background:#3498db" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(state.final + ' recipe')}', '_blank')">🔍 Search Recipes</button>`;
        }
    }
    updateUI();
</script>
</body>
</html>
